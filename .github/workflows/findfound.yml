name: Build and publish Find & Found
on:
  push:
    paths-ignore: ['README.md', 'GO-LIVE.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: findfound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - name: Use the Android SDK already on the runner
        run: echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV && echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Location and camera permissions
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          npm install --no-save @capacitor/assets@3 --no-audit --no-fund
          mkdir -p assets && cp resources/icon.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#1650C8' || echo "icon step skipped"
      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/FindFound-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/FindFound-Android.apk }

  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Open the live website inside the app when it exists
        shell: bash
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          if curl -sfI "$URL" >/dev/null; then echo "{ \"url\": \"$URL\" }" > electron/site.json; fi
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*.exe' }

  ios:
    name: iPhone / iPad app (.ipa, unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add ios
      - name: Location and camera permission messages
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Find & Found uses your location to show lost items, property and help near you.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Find & Found uses the camera for AI Scan and to photograph items you post.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Find & Found lets you pick photos to attach to your posts.'" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Find & Found uses the microphone for voice search and short alert clips.'" $P
      - name: App icon
        run: |
          npm install --no-save @capacitor/assets@3 --no-audit --no-fund
          mkdir -p assets && cp resources/icon.png assets/icon.png
          npx capacitor-assets generate --ios || echo "icon step skipped"
      - run: npx cap sync ios
      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry FindFound-iOS-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/FindFound-iOS-unsigned.ipa }

  release:
    name: Download page (GitHub Release)
    needs: [android, windows, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Find & Found 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `FindFound-Android.apk`, open it, and allow "Install from this source" when asked.
            **Windows:** download `FindFound-Setup-…exe` (installs with a Start-menu icon) or `FindFound-Portable-…exe` (runs without installing). If Windows SmartScreen appears, choose *More info → Run anyway*.
            **iPhone / iPad:** easiest: open the website in Safari → Share → *Add to Home Screen*. Or install `FindFound-iOS-unsigned.ipa` with Sideloadly or AltStore using your Apple ID (free Apple IDs must re-install every 7 days). App Store version coming.
          files: out/*
